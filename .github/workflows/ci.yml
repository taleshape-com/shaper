# SPDX-License-Identifier: MPL-2.0

# Lint, test, build and release
#
# The jobs are layed out in a way that prioritizes reducing total spent resources (CPU time).
# This means that we don't parallelize as much as we could.
# But at the same time we parallelize some work work to reduce the total duration.
# It's a balance between the two.
name: CI
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install dependencies
        # Ignore Scripts for security
        run: npm ci --ignore-scripts
      - name: Build frontend
        run: |
          NODE_ENV=production npm run all
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  go-verify:
    name: Go Vet and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Tidy Go modules
        run: go mod tidy
      - name: Create placeholder dist directory
        run: |
          mkdir -p dist
          touch dist/placeholder
      - name: Run go vet
        run: go vet ./...
      - name: Run go test
        run: go test ./...

  build-linux:
    name: Build Linux Binaries
    needs: [go-verify, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Keep in sync with Dockerfile
    container: debian:13.6-slim@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install required packages
        run: |
          apt-get update
          apt-get install -y wget git build-essential
          # Install cross-compilation tools for arm64
          apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Download frontend build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist/

      - name: Build Linux binaries
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(echo "$REF_NAME" | sed 's/^v//')
          mkdir -p bin
          # Build amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -o bin/shaper-linux-amd64 -ldflags="-w -s -X 'main.Version=$VERSION'"
          # Build arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc go build -o bin/shaper-linux-arm64 -ldflags="-w -s -X 'main.Version=$VERSION'"

      - name: Generate checksums
        run: |
          cd bin
          sha256sum shaper-linux-* > checksums-linux.txt

      - name: Upload Linux binaries and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binaries
          path: |
            bin/shaper-linux-*
            bin/checksums-linux.txt
          retention-days: 1

  build-darwin:
    name: Build macOS Binaries
    needs: [go-verify, frontend-build]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Xcode Command Line Tools
        run: |
          xcode-select --install || true
          # Wait for installation to complete
          while ! xcode-select -p; do
            sleep 5
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Download frontend build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist/

      - name: Build macOS binaries
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(echo "$REF_NAME" | sed 's/^v//')
          mkdir -p bin
          # Build amd64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -o bin/shaper-darwin-amd64 -ldflags="-X 'main.Version=$VERSION'"
          # Build arm64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -o bin/shaper-darwin-arm64 -ldflags="-X 'main.Version=$VERSION'"

      - name: Generate checksums
        run: |
          cd bin
          shasum -a 256 shaper-darwin-* > checksums-darwin.txt

      - name: Upload macOS binaries and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-binaries
          path: |
            bin/shaper-darwin-*
            bin/checksums-darwin.txt
          retention-days: 1

  release:
    name: Create Release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Linux binaries and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-binaries
          path: bin

      - name: Download macOS binaries and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-binaries
          path: bin

      - name: Combine checksums
        run: |
          cd bin
          cat checksums-*.txt | sort | uniq > SHA256SUMS
          rm checksums-*.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/shaper-linux-*
            bin/shaper-darwin-*
            bin/SHA256SUMS

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/shaper-linux-* \
            bin/shaper-darwin-* \
            bin/SHA256SUMS \
            --generate-notes

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-binaries
          path: bin/

      - name: Make binaries executable
        run: chmod +x bin/shaper-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(echo "$REF_NAME" | sed 's/^v//')
          # Split version into components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
          echo "MINOR=$MAJOR.$MINOR" >> $GITHUB_OUTPUT

      - name: Build and push Docker images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            taleshape/shaper:latest
            taleshape/shaper:${{ steps.version.outputs.VERSION }}
            taleshape/shaper:${{ steps.version.outputs.MINOR }}
            taleshape/shaper:${{ steps.version.outputs.MAJOR }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_DATE=${{ github.event.release.published_at || github.event.head_commit.timestamp }}

  npm-publish:
    name: Publish to npm
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # this permission is mandatory for Trusted Publishing
      id-token: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux binaries and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-binaries
          path: bin

      - name: Download macOS binaries and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-binaries
          path: bin

      - name: Combine checksums
        run: |
          cat bin/checksums-*.txt | sort | uniq > npm-package/bin/SHA256SUMS

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Update npm package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd npm-package
          npm version $(echo "$REF_NAME" | sed 's/^v//') --no-git-tag-version

      - name: Publish to npm
        run: |
          cd npm-package
          # Use --provenance for OIDC-linked builds.
          # Note: Requires Trusted Publishing setup on npmjs.com.
          npm publish --provenance --access public

  pypi-publish:
    name: Publish to PyPI
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # this permission is mandatory for Trusted Publishing
      id-token: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux binaries and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-binaries
          path: bin

      - name: Download macOS binaries and checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-binaries
          path: bin

      - name: Combine checksums
        run: |
          mkdir -p pip-package/shaper_pkg/bin
          cat bin/checksums-*.txt | sort | uniq > pip-package/shaper_pkg/bin/SHA256SUMS

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Update Python package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd pip-package
          VERSION=$(echo "$REF_NAME" | sed 's/^v//')
          # Update version in pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          # Update version in __init__.py
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" shaper_pkg/__init__.py

      - name: Build Python package
        run: |
          cd pip-package
          pip install wheel
          # Build sdist (source distribution)
          python -m build --sdist

          # Build platform-specific wheels
          # We use specific platform tags to ensure PyPI serves the right binary
          platforms=(
            "linux-amd64:manylinux2014_x86_64"
            "linux-arm64:manylinux2014_aarch64"
            "darwin-amd64:macosx_10_9_x86_64"
            "darwin-arm64:macosx_11_0_arm64"
          )

          for p in "${platforms[@]}"; do
            binary_suffix="${p%%:*}"
            plat_name="${p#*:}"

            echo "Building wheel for $plat_name..."
            # Copy the binary to the package directory
            cp "../bin/shaper-$binary_suffix" shaper_pkg/bin/shaper
            chmod +x shaper_pkg/bin/shaper

            # Create the wheel with the platform tag
            python setup.py bdist_wheel --plat-name "$plat_name"

            # Clean up for the next platform
            rm -rf build/
            rm shaper_pkg/bin/shaper
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No token needed since we are using Trusted Publishing
        with:
          packages-dir: pip-package/dist/
