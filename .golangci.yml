# SPDX-License-Identifier: MPL-2.0

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    staticcheck:
      checks: ["SA*"]

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: "node_modules/.*"
        linters:
          - govet

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
